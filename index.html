<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>My Image Gallery</h1>
    <p>Explore beautiful images</p>
</header>

<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
</div>

<div class="gallery">
    <div class="gallery-item nature">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Nature" onclick="openLightbox(this)">
    </div>
    <div class="gallery-item city">
        <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=800&q=80" alt="City" onclick="openLightbox(this)">
    </div>
    <div class="gallery-item animals">
        <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80" alt="Dog" onclick="openLightbox(this)">
    </div>
    <div class="gallery-item nature">
        <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=800&q=80" alt="Mountain" onclick="openLightbox(this)">
    </div>
    <div class="gallery-item city">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80" alt="City" onclick="openLightbox(this)">
    </div>
    <div class="gallery-item animals">
        <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=800&q=80" alt="Lion" onclick="openLightbox(this)">
    </div>
</div>

<div id="lightbox" class="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <button class="prev" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="Preview">
    <button class="next" onclick="changeImage(1)">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
